name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes de unidade e build
    runs-on: ubuntu-latest
    env:
      # O build só precisa de valores válidos; não conecta ao banco.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-sem-banco
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integracao-e-sistema:
    name: Testes de integração e de sistema (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - run: npm ci
      - name: Sobe o Supabase local e aplica as migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta,mailpit
      - name: Exporta as chaves do Supabase local
        run: |
          supabase status -o env | tr -d '"' | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' >> "$GITHUB_ENV"
      - run: npm run test:integracao
      - run: npx playwright install --with-deps chromium
      - name: Testes de sistema (build de produção + navegador)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

  migrations-producao:
    name: Aplica as migrations no Supabase de produção
    # Só depois dos testes passarem, e só para o que entrou na main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qualidade, integracao-e-sistema]
    runs-on: ubuntu-latest
    environment: producao
    concurrency:
      group: migrations-producao
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Confere os segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD (secrets) e SUPABASE_PROJECT_REF (variable) no environment 'producao'."
            exit 1
          fi
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Lista o que será aplicado
        run: supabase migration list
      - run: supabase db push
